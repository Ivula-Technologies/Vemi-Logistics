name: Build cPanel Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Browser-visible values are baked into the bundle at build time.
      # Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (public values) once the Supabase project exists.
      # Repository Variables under Settings > Secrets and variables > Actions override them.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || '' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://vemi.ivulatechnologies.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Build
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY repository variables are not set. Building with placeholders; this package will not work in production."
            export NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_placeholder
          fi
          npm run build

      - name: Assemble package
        run: |
          mkdir -p cpanel-package/.next
          cp -a .next/standalone/. cpanel-package/
          cp -a .next/static cpanel-package/.next/static
          if [ -d public ]; then cp -a public cpanel-package/public; fi
          cp .env.example DEPLOY.md cpanel-package/
          mkdir -p cpanel-package/database && cp supabase/migrations/*.sql cpanel-package/database/
          test -f cpanel-package/server.js
          test -f cpanel-package/.next/BUILD_ID

      - uses: actions/upload-artifact@v4
        with:
          name: vemi-cpanel
          path: cpanel-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
